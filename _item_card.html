<article class="card item-card"><div>{% if item.image %}<img class="thumb" src="{{ url_for('static', filename=item.image) }}" alt="{{ item.item_name }}">{% else %}<div class="thumb placeholder">＋</div>{% endif %}</div><div><h3>{{ item.item_name }}</h3><p>{{ item.category }} · {{ item.location }}</p><p>{{ item.description|truncate(110) }}</p><span class="badge {{ item.type|lower }}{% if item.status == 'Claimed' %} claimed{% endif %}">{{ item.type }} · {{ item.status }}</span>{% if item.type == 'Found' and item.status == 'Open' %}<a class="button secondary" href="{{ url_for('claim', item_id=item.id) }}" style="margin-top:.7rem">Claim item</a>{% endif %}</div></article>
