{% extends 'base.html' %}{% block title %}Report {{ item_type }} item{% endblock %}{% block content %}
<a class="back" href="{{ url_for('dashboard') }}">← Dashboard</a><p class="eyebrow">New report</p><h1 class="page-title">Report a {{ item_type|lower }} item</h1><p>Share enough detail for someone on campus to recognize it.</p>
<form class="card form-card" method="post" enctype="multipart/form-data"><label>Item name<input name="item_name" placeholder="e.g. Blue water bottle" required></label><label>Category<input name="category" placeholder="e.g. Electronics, books, clothing" required></label><label>Description<textarea name="description" placeholder="Color, brand, identifying marks..." required></textarea></label><label>Where was it {{ 'lost' if item_type == 'Lost' else 'found' }}?<input name="location" placeholder="Building, room, or area" required></label><label>Date<input type="date" name="date" required></label><label>Photo <span style="font-weight:normal;color:var(--muted)">(optional, max 5 MB)</span><input type="file" name="image" accept="image/png,image/jpeg,image/gif,image/webp"></label><button type="submit">Publish {{ item_type|lower }} report</button></form>
{% endblock %}
